name: Verify reliability evidence
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Verify contracts, concurrency, restart and DLQ behavior
        run: mvn -B -ntp verify
      - name: Preserve test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-java-${{ matrix.java }}
          path: |
            **/target/surefire-reports/**
            **/target/site/jacoco/**
